name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra ml

      - name: Lint
        run: |
          uv run ruff check src ml tests
          uv run ruff format --check src ml tests

      # The model artifacts are not committed, so CI rebuilds them. The crop
      # model trains in seconds; the pest model needs the image dataset.
      - name: Build the crop model
        run: uv run python -m ml.train_crop

      - name: Build the pest dataset and model
        run: |
          uv run python -m ml.prepare_dataset
          uv run python -m ml.train_pest
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"

      - name: Test
        run: uv run pytest --cov=cropcraft --cov-report=term-missing

  docker:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cropcraft:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
