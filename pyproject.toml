[project]
name = "cropcraft"
version = "2.0.0"
description = "Crop, fertilizer and pesticide recommendation for Indian farms"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Nikesh Walia" }]

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.38",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "numpy>=2.2",
    "pandas>=2.3",
    "scikit-learn>=1.9",
    "pillow>=12",
]

[project.optional-dependencies]
# TensorFlow is needed to train *and* to serve the pest classifier.
ml = ["tensorflow>=2.21"]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.14",
]

[project.scripts]
cropcraft = "cropcraft.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropcraft"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"ml/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
